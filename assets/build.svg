<style>.h{font:700 22px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#FFC24B;letter-spacing:.3px}.n{font:700 46px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#FFC24B}.c{font:650 20px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif}.t{font:600 17px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#E8EDF7}.d{font:400 14.5px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#A9B4D0}.s{font:500 12.5px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#7D88A8}</style>
<defs><linearGradient id="cab" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#161E33"/><stop offset="1" stop-color="#0E1424"/></linearGradient></defs><rect x="10" y="10" width="485" height="130" rx="12" fill="url(#cab)" stroke="#2B3557" stroke-width="2"/><text class="c" fill="#7FE3F0" x="36" y="56">Web apps</text><text class="d" x="36" y="90">Laravel and plain-PHP platforms with Stripe</text><text class="d" x="36" y="113">payments, e-signatures and admin dashboards</text><rect x="505" y="10" width="485" height="130" rx="12" fill="url(#cab)" stroke="#2B3557" stroke-width="2"/><text class="c" fill="#7FE3F0" x="531" y="56">Chrome extensions</text><text class="d" x="531" y="90">Chrome extensions for screen monitoring,</text><text class="d" x="531" y="113">offline alerts and Google Maps lead scraping</text><rect x="10" y="150" width="485" height="130" rx="12" fill="url(#cab)" stroke="#2B3557" stroke-width="2"/><text class="c" fill="#7FE3F0" x="36" y="196">Android apps</text><text class="d" x="36" y="230">NativePHP and Laravel Android apps that</text><text class="d" x="36" y="253">manage LED screens from your phone</text><rect x="505" y="150" width="485" height="130" rx="12" fill="url(#cab)" stroke="#2B3557" stroke-width="2"/><text class="c" fill="#7FE3F0" x="531" y="196">LED screen tools</text><text class="d" x="531" y="230">Tools that publish video loops to DOOH</text><text class="d" x="531" y="253">and transparent-LED ad screens</text></svg>
